# Slack app for gaidin. Create it at https://api.slack.com/apps > Create New App > From a manifest,
# in your workspace. Steps after that are in docs/surfaces.md under "Setting up Slack".
display_information:
  name: gaidin
  description: A personal agent, on Pi Durable
features:
  bot_user:
    display_name: gaidin
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
      # Each agent other than the default one posts under its own name (src/slack/api.ts).
      - chat:write.customize
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  # Button presses on approvals, questions, reminders and paused jobs (src/slack/notifications.ts), delivered over Socket Mode.
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
