allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
# Package versions must be 3 days old before pnpm resolves them (pnpm's default is 1 day).
minimumReleaseAge: 4320
# Pi Durable 1.3.0 and the packages it pins, allowed early for the upgrade; remove once they're 3 days old (2026-10-18).
minimumReleaseAgeExclude:
  - '@earendil-works/pi-durable@1.3.0'
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/chord@1.3.0'
  - '@earendil-works/pi-codemode@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
