<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>gaidin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0d10">
<style>
/* Hallmark · redesign · genre: modern-minimal (app) · structure: console (horizon / log / dock / status line)
 * tone: technical, utilitarian · palette: cool-neutral dark, hue 250 · accent: steel blue
 * fonts: system mono for the console, system humanist sans for gaidin's prose
 * pre-emit critique: P5 H4 E4 S5 R4 V5 */
:root {
	--color-paper: oklch(15.5% 0.008 250);
	--color-paper-2: oklch(18.5% 0.009 250);
	--color-paper-3: oklch(22.5% 0.011 250);
	--color-rule: oklch(25.5% 0.011 250);
	--color-rule-2: oklch(33% 0.013 250);
	--color-ink: oklch(92% 0.006 250);
	--color-ink-2: oklch(75% 0.012 250);
	--color-ink-3: oklch(57% 0.012 250);
	--color-accent: oklch(76% 0.075 240);
	--color-accent-ink: oklch(18% 0.02 240);
	--color-voice: oklch(78% 0.07 175);
	--color-warn: oklch(82% 0.11 85);
	--color-warn-wash: oklch(82% 0.11 85 / 0.07);
	--color-bad: oklch(71% 0.13 22);
	--color-bad-wash: oklch(71% 0.13 22 / 0.1);
	--color-focus: oklch(80% 0.09 240);
	--color-focus-quiet: oklch(46% 0.02 245);

	--font-body: Seravek, "Gill Sans Nova", Ubuntu, "Noto Sans", "Open Sans", Calibri, "DejaVu Sans", sans-serif;
	--font-mono: "SF Mono", ui-monospace, "JetBrains Mono", "Cascadia Mono", "Noto Sans Mono", "DejaVu Sans Mono", monospace;

	--text-2xs: 0.75rem;
	--text-xs: 0.8125rem;
	--text-sm: 0.9375rem;
	--text-md: 1.0625rem;

	--space-3xs: 2px;
	--space-2xs: 4px;
	--space-xs: 8px;
	--space-sm: 12px;
	--space-md: 16px;
	--space-lg: 24px;

	--radius-sm: 4px;
	--radius-md: 6px;

	--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
	--dur-short: 120ms;

	/* The log's columns: time, label, body. The prompt and approvals use the same grid. */
	--col-time: 6ch;
	--col-label: 7ch;
	--col-gap: 2ch;
	--measure: 1080px;

	color-scheme: dark;
	font-family: var(--font-mono);
	font-size: var(--text-sm);
	line-height: 1.55;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: clip; }
body { background: var(--color-paper); color: var(--color-ink); -webkit-font-smoothing: antialiased; }
button, textarea, input { font: inherit; color: inherit; }
pre { margin: 0; font-family: var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
:focus-visible { outline: 1px solid var(--color-focus-quiet); outline-offset: 1px; }

button {
	display: inline-flex; align-items: center; gap: var(--space-2xs); min-height: 26px; padding: 0 var(--space-xs);
	white-space: nowrap; cursor: pointer; background: var(--color-paper-2); border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm);
	transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
@media (hover: hover) { button:hover:not(:disabled) { background: var(--color-paper-3); border-color: var(--color-ink-3); } }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); font-weight: 600; }
@media (hover: hover) { button.primary:hover:not(:disabled) { background: var(--color-focus); border-color: var(--color-focus); } }
button.danger { color: var(--color-bad); }
@media (hover: hover) { button.danger:hover:not(:disabled) { background: var(--color-bad-wash); border-color: var(--color-bad); } }
button.plain { background: transparent; border-color: transparent; color: var(--color-ink-3); }
@media (hover: hover) { button.plain:hover:not(:disabled) { background: var(--color-paper-3); border-color: transparent; color: var(--color-ink); } }
kbd { font-family: var(--font-mono); font-size: var(--text-2xs); color: inherit; opacity: 0.75; }

/* Installed as an app, the page runs under the notch and the home bar; the insets keep it clear of both. */
#app {
	display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100dvh;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* --- horizon: what's next ----------------------------------------------------------------------- */

#horizon {
	display: flex; align-items: center; gap: var(--space-md); height: 44px; padding: 0 var(--space-md);
	border-bottom: 1px solid var(--color-rule); font-size: var(--text-xs);
}
#horizon h1 { margin: 0; flex: none; }
#horizon h1 img { display: block; }
#views { display: flex; align-self: stretch; gap: var(--space-3xs); }
#views a {
	display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); padding: 2px var(--space-sm) 0; margin-bottom: -1px;
	color: var(--color-ink-3); font-family: var(--font-body); font-size: var(--text-sm); font-weight: 500; text-decoration: none; border-bottom: 2px solid transparent;
	transition: color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
@media (hover: hover) { #views a:hover { color: var(--color-ink); } }
#views a[aria-current="page"] { color: var(--color-ink); border-bottom-color: var(--color-accent); }
#views .count { color: var(--color-ink-3); font-family: var(--font-mono); font-size: var(--text-2xs); font-weight: 400; font-variant-numeric: tabular-nums; }
#views .count:empty { display: none; }
#views .count.warn { color: var(--color-warn); }
#next-up { min-width: 0; max-width: 34ch; flex: 0 1 auto; margin-left: auto; color: var(--color-ink-2); }
#next-up span { overflow: hidden; text-overflow: ellipsis; }
#next-up .soon { color: var(--color-warn); }

/* --- the log ----------------------------------------------------------------------------------- */

/* A short log sits against the prompt, as in a terminal. */
main[hidden], #scroll[hidden] { display: none; }
#scroll { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; scrollbar-color: var(--color-rule-2) transparent; }
#log { width: 100%; max-width: var(--measure); margin: auto auto 0; padding: var(--space-md) var(--space-md) var(--space-lg); }
.row {
	display: grid; grid-template-columns: var(--col-time) var(--col-label) minmax(0, 1fr); column-gap: var(--col-gap);
	align-items: baseline; padding: var(--space-3xs) 0;
}
.row.start { margin-top: var(--space-md); padding-top: var(--space-sm); border-top: 1px solid var(--color-rule); }
#log > .row.start:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.row .t { color: var(--color-ink-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.row .k { color: var(--color-ink-3); text-align: right; white-space: nowrap; }
.row .b { min-width: 0; overflow-wrap: anywhere; }

.row.you .k, .row.cmd .k { color: var(--color-accent); }
.row.you .b { color: var(--color-ink); font-weight: 600; white-space: pre-wrap; }
.row.cmd .b { color: var(--color-ink-2); white-space: pre-wrap; }
.row.prompt .k { color: var(--color-voice); }
.row.prompt .b { color: var(--color-ink-2); font-size: var(--text-xs); white-space: pre-wrap; }
.row.gaidin .k { color: var(--color-voice); }
.row.remind .k, .row.job .k { color: var(--color-warn); }
.row.remind .b, .row.job .b { color: var(--color-ink); font-weight: 600; }
.row .why { margin-left: 1ch; color: var(--color-bad); font-weight: 400; }
.row .snooze { margin-left: 2ch; display: inline-flex; gap: var(--space-2xs); }
.row.err .k, .row.err .b { color: var(--color-bad); }
.row.sys .b { color: var(--color-ink-2); }

/* Thinking and tool calls: one line each, opened for the full text. */
.row details summary { display: flex; gap: 1ch; align-items: baseline; cursor: pointer; list-style: none; border-radius: var(--radius-sm); }
.row details summary::-webkit-details-marker { display: none; }
@media (hover: hover) { .row details summary:hover { background: var(--color-paper-2); } }
.row details summary::after { content: "+"; flex: none; color: var(--color-ink-3); }
.row details[open] summary::after { content: "−"; }
.row .name { flex: none; color: var(--color-accent); }
.row.think .name { color: var(--color-ink-3); }
.row .args { flex: 1; min-width: 0; color: var(--color-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.think .args { font-family: var(--font-body); font-size: var(--text-sm); }
.row .state { flex: none; color: var(--color-ink-3); font-size: var(--text-xs); }
.row.s-running .state, .row.s-running .k { color: var(--color-accent); }
.row.s-running .state::before { content: "● "; animation: pulse 1.2s var(--ease-out) infinite; }
.row.s-waiting .state { color: var(--color-warn); }
.row.s-error .state, .row.s-error .name, .row.s-no-result .state { color: var(--color-bad); }
@keyframes pulse { 50% { opacity: 0.2; } }
.fold { display: flex; flex-direction: column; gap: var(--space-2xs); margin: var(--space-2xs) 0 var(--space-xs); }
.fold .label { color: var(--color-ink-3); font-size: var(--text-xs); }
.fold pre, .tail { padding: var(--space-xs) var(--space-sm); max-height: 420px; overflow: auto; background: var(--color-paper-2); border: 1px solid var(--color-rule); border-radius: var(--radius-sm); color: var(--color-ink-2); font-size: var(--text-xs); }
.row.think .fold pre { font-family: var(--font-body); font-size: var(--text-sm); }
.tail { margin-top: var(--space-2xs); max-height: none; color: var(--color-ink-3); }

/* gaidin's own words, in the humanist face. */
.b.prose { font-family: var(--font-body); font-size: var(--text-md); line-height: 1.55; }
.md { max-width: 76ch; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md .table { margin: 0 0 var(--space-sm); }
.md h3, .md h4, .md h5 { margin: var(--space-md) 0 var(--space-xs); font-size: var(--text-md); font-weight: 600; }
.md ul, .md ol { padding-left: var(--space-lg); }
.md ul { list-style-type: disc; }
.md ul ul { list-style-type: circle; }
.md li { margin: var(--space-3xs) 0; }
.md li > ul, .md li > ol { margin: var(--space-3xs) 0 0; }
.md li::marker { color: var(--color-ink-3); }
.md strong { font-weight: 600; }
.md a { color: var(--color-accent); text-decoration: underline; text-decoration-color: var(--color-rule-2); text-underline-offset: 2px; }
@media (hover: hover) { .md a:hover { text-decoration-color: currentColor; } }
.md code { padding: 1px 5px; background: var(--color-paper-3); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 0.85em; }
.md pre { padding: var(--space-sm) var(--space-md); overflow-x: auto; white-space: pre; overflow-wrap: normal; background: var(--color-paper-2); border: 1px solid var(--color-rule); border-radius: var(--radius-sm); }
.md pre code { padding: 0; background: none; font-size: var(--text-xs); }
.md blockquote { padding-left: var(--space-sm); border-left: 2px solid var(--color-rule-2); color: var(--color-ink-2); }
.md hr { border: 0; border-top: 1px solid var(--color-rule); margin: var(--space-md) 0; }
.md .table { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.md th, .md td { padding: var(--space-2xs) var(--space-md) var(--space-2xs) 0; border-bottom: 1px solid var(--color-rule); text-align: left; vertical-align: top; }
.md th { color: var(--color-ink-2); font-weight: 600; border-bottom-color: var(--color-rule-2); }
.md td:last-child, .md th:last-child { padding-right: 0; }

/* Command output. */
.out { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 0 2ch; align-items: baseline; }
.out > * { padding: var(--space-3xs) 0; }
.out .dim { color: var(--color-ink-3); }
.out .on { color: var(--color-voice); }
.out .off { color: var(--color-bad); }
.out button { justify-self: end; }
.actions { display: flex; flex-wrap: wrap; gap: 1ch; }
.out .actions { justify-self: end; flex-wrap: nowrap; }
.timeline { grid-template-columns: auto auto minmax(0, 2fr) minmax(0, 1fr); }
.timeline > span { overflow-wrap: anywhere; }
.help { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 0 2ch; }
.help .c { color: var(--color-accent); }
.help .a, .help .h { color: var(--color-ink-3); }
.keys { margin-top: var(--space-xs); color: var(--color-ink-3); }

/* --- schedule: reminders and jobs ------------------------------------------------------------- */

main:not(#scroll) { overflow-y: auto; overscroll-behavior: contain; scrollbar-color: var(--color-rule-2) transparent; }
.page { display: flex; flex-direction: column; gap: var(--space-lg); max-width: var(--measure); margin: 0 auto; padding: var(--space-lg) var(--space-md); }
.section-head { display: flex; align-items: center; gap: var(--space-xs); padding: 0 0 var(--space-xs) var(--space-xs); border-bottom: 1px solid var(--color-rule-2); }
.section-head h2 { margin: 0; font-family: var(--font-body); font-size: var(--text-md); font-weight: 600; }
.section-head .count { color: var(--color-ink-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.section-head .head-actions { display: flex; gap: var(--space-2xs); margin-left: auto; }
.section-head .head-actions button { font-size: var(--text-xs); }
.page-problem { margin: 0; padding: var(--space-xs) var(--space-sm); background: var(--color-bad-wash); border: 1px solid var(--color-bad); border-radius: var(--radius-sm); color: var(--color-bad); }
.page-empty { margin: var(--space-sm) 0 0; padding: 0 var(--space-xs); font-family: var(--font-body); color: var(--color-ink-3); }
.sched-list { margin: 0; padding: 0; list-style: none; }
.sched-row {
	display: grid; grid-template-columns: 15ch minmax(0, 1fr) auto; grid-template-areas: "due body actions"; column-gap: var(--col-gap);
	align-items: start; padding: var(--space-sm) var(--space-xs); border-bottom: 1px solid var(--color-rule);
	transition: background-color var(--dur-short) var(--ease-out);
}
@media (hover: hover) { .sched-row:hover { background: var(--color-paper-2); } }
.sched-row .due { grid-area: due; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; line-height: 1.4; }
.sched-row .due .at { color: var(--color-ink); }
.sched-row .due .in { color: var(--color-ink-3); font-size: var(--text-xs); }
.sched-row .due.soon .at, .sched-row .due.soon .in, .sched-row .due.warn .at { color: var(--color-warn); }
.sched-row .body { grid-area: body; min-width: 0; }
.sched-row .title { font-family: var(--font-body); font-size: var(--text-md); font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.sched-row.paused .title { color: var(--color-ink-2); }
.sched-row .toggle {
	display: inline; min-height: 0; padding: 0; text-align: left; white-space: normal;
	background: none; border: 0; border-radius: var(--radius-sm); color: var(--color-ink);
}
.sched-row .toggle::after { content: "+"; margin-left: 1ch; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--color-ink-3); }
.sched-row .toggle[aria-expanded="true"]::after { content: "−"; }
@media (hover: hover) { .sched-row .toggle:hover:not(:disabled) { background: none; color: var(--color-accent); } }
.sched-row .toggle:active:not(:disabled) { transform: none; }
/* Each part carries its "·" in the space before it; the one starting a line falls in the clipped 2ch on the left. */
.sched-row .meta {
	display: flex; flex-wrap: wrap; align-items: baseline; margin: var(--space-3xs) 0 0 -2ch; clip-path: inset(0 0 0 2ch);
	color: var(--color-ink-3); font-size: var(--text-xs);
}
.sched-row .meta > span { margin-left: 2ch; }
.sched-row .meta > span::before { content: "·"; display: inline-block; width: 2ch; margin-left: -2ch; text-align: center; }
.sched-row .meta .tag { padding: 0 var(--space-xs); border: 1px solid var(--color-rule-2); border-radius: 999px; color: var(--color-voice); font-size: var(--text-2xs); line-height: 1.6; }
.sched-row .meta .tag::before { content: none; }
.sched-row .meta .bad { color: var(--color-bad); }
.sched-row .status { margin-top: var(--space-3xs); font-size: var(--text-xs); }
.sched-row .status.warn { color: var(--color-warn); }
.sched-row .status.bad { color: var(--color-bad); }
.sched-row .actions { grid-area: actions; flex-wrap: nowrap; gap: var(--space-2xs); }
.sched-row .detail {
	display: flex; flex-direction: column; gap: var(--space-2xs); margin-top: var(--space-sm); padding: var(--space-sm) var(--space-md);
	background: var(--color-paper); border: 1px solid var(--color-rule); border-radius: var(--radius-md);
}
.sched-row .detail .label { margin-top: var(--space-xs); color: var(--color-ink-3); font-size: var(--text-2xs); }
.sched-row .detail .label:first-child { margin-top: 0; }
.sched-row .detail .instruction { margin: 0; max-width: 76ch; font-family: var(--font-body); white-space: pre-wrap; color: var(--color-ink-2); }
.sched-row .detail pre { color: var(--color-ink-2); font-size: var(--text-xs); }
.sched-row .detail .report { padding-top: var(--space-xs); }
.sched-row .detail .report + .report { margin-top: var(--space-xs); border-top: 1px solid var(--color-rule); }
.sched-row .detail .report .stamp { margin-bottom: var(--space-2xs); color: var(--color-ink-3); font-size: var(--text-xs); }
.sched-row .detail .md { font-family: var(--font-body); }

/* --- skills: the guides gaidin can open ------------------------------------------------------- */

.tag { padding: 0 var(--space-xs); border: 1px solid var(--color-rule-2); border-radius: 999px; color: var(--color-ink-3); font-size: var(--text-2xs); line-height: 1.6; white-space: nowrap; }
.page-note { margin: var(--space-sm) 0 0; padding: 0 var(--space-xs); max-width: 76ch; font-family: var(--font-body); color: var(--color-ink-3); }
.skill-list { margin: var(--space-sm) 0 0; padding: 0; list-style: none; border-top: 1px solid var(--color-rule); }
.skill-row {
	display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title files" "desc desc"; column-gap: var(--col-gap); row-gap: var(--space-2xs);
	padding: var(--space-sm) var(--space-xs); border-bottom: 1px solid var(--color-rule); color: var(--color-ink); text-decoration: none;
	transition: background-color var(--dur-short) var(--ease-out);
}
@media (hover: hover) { .skill-row:hover { background: var(--color-paper-2); } .skill-row:hover .name { text-decoration: underline; text-underline-offset: 3px; } }
.skill-row .title { grid-area: title; display: flex; align-items: baseline; gap: var(--space-xs); }
.skill-row .name { color: var(--color-accent); font-weight: 600; }
.skill-row .desc { grid-area: desc; margin: 0; max-width: 76ch; font-family: var(--font-body); color: var(--color-ink-2); }
.skill-row .files { grid-area: files; color: var(--color-ink-3); font-size: var(--text-xs); }

.crumbs { display: flex; gap: 1ch; padding: 0 var(--space-xs); color: var(--color-ink-3); font-size: var(--text-xs); }
.crumbs a { color: var(--color-ink-3); text-underline-offset: 3px; }
@media (hover: hover) { .crumbs a:hover { color: var(--color-ink); } }
.skill-header { display: flex; flex-direction: column; gap: var(--space-xs); }
.skill-head { display: flex; align-items: baseline; gap: var(--space-xs); padding: 0 var(--space-xs); }
.skill-head h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
.skill-desc { margin: 0; padding: 0 var(--space-xs); max-width: 76ch; font-family: var(--font-body); color: var(--color-ink-2); }
.skill-body { display: grid; grid-template-columns: 22ch minmax(0, 1fr); gap: var(--space-lg); align-items: start; padding-top: var(--space-md); border-top: 1px solid var(--color-rule); }
.skill-files { position: sticky; top: var(--space-md); display: flex; flex-direction: column; gap: 1px; font-size: var(--text-xs); }
.skill-files a { padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-sm); color: var(--color-ink-3); text-decoration: none; overflow-wrap: anywhere; }
@media (hover: hover) { .skill-files a:hover { background: var(--color-paper-2); color: var(--color-ink); } }
.skill-files a[aria-current="page"] { background: var(--color-paper-3); color: var(--color-ink); }
.skill-doc { min-width: 0; padding-bottom: var(--space-lg); }
.skill-doc .md { font-family: var(--font-body); font-size: var(--text-md); line-height: 1.6; }
.skill-doc .md h2 { margin: 0 0 var(--space-sm); font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
.skill-doc .md h3 { margin: var(--space-lg) 0 var(--space-xs); padding-top: var(--space-md); border-top: 1px solid var(--color-rule); font-size: 1.125rem; }
.skill-doc .md h4 { margin: var(--space-md) 0 var(--space-xs); }
.skill-doc .md :is(h2, h3, h4) { scroll-margin-top: var(--space-md); }
.skill-doc pre { padding: var(--space-sm) var(--space-md); background: var(--color-paper-2); border: 1px solid var(--color-rule); border-radius: var(--radius-sm); font-size: var(--text-xs); }

/* --- forms, shared by the pages ---------------------------------------------------------------- */

.page input, .page textarea {
	display: block; width: 100%; margin: 0; padding: var(--space-xs) var(--space-sm); background: var(--color-paper-2); border: 1px solid var(--color-rule-2);
	border-radius: 8px; color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.45; outline: none; resize: none;
	transition: border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
.page input:focus, .page textarea:focus { border-color: var(--color-focus-quiet); background: oklch(19.5% 0.01 250); }
.page input::placeholder, .page textarea::placeholder { color: var(--color-ink-3); }
.page textarea.editor { min-height: 240px; padding: var(--space-sm) var(--space-md); font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.6; tab-size: 4; }
.note-bar, .form-bar, .doc-bar { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-xs); }
.note-bar button[hidden] { display: none; }
.chars { margin-right: auto; color: var(--color-ink-3); font-size: var(--text-2xs); font-variant-numeric: tabular-nums; }
.chars.over { color: var(--color-bad); }
.saved { margin: var(--space-xs) 0 0; padding: 0 var(--space-xs); color: var(--color-voice); font-size: var(--text-xs); }
.section-head .usage { margin-left: auto; color: var(--color-ink-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.section-head .usage.near { color: var(--color-warn); }

/* --- memory ------------------------------------------------------------------------------------ */

.note-add { display: flex; flex-direction: column; gap: var(--space-xs); margin-top: var(--space-md); }
.note-list { margin: var(--space-md) 0 0; padding: 0; list-style: none; border-top: 1px solid var(--color-rule); }
.note-row {
	display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "text actions" "meta meta"; column-gap: var(--col-gap); row-gap: var(--space-2xs);
	padding: var(--space-sm) var(--space-xs); border-bottom: 1px solid var(--color-rule);
}
.note-row .text { grid-area: text; margin: 0; max-width: 76ch; font-family: var(--font-body); font-size: var(--text-md); line-height: 1.5; overflow-wrap: anywhere; }
.note-row .actions { grid-area: actions; flex-wrap: nowrap; gap: var(--space-2xs); }
.note-row .meta { grid-area: meta; display: flex; gap: 1ch; color: var(--color-ink-3); font-size: var(--text-2xs); }
.note-row .meta > span + span::before { content: "·"; margin-right: 1ch; }
.note-row .by.owner { color: var(--color-accent); }
.note-row .by.gaidin { color: var(--color-voice); }
.note-row.editing { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; background: var(--color-paper-2); }
.note-row.editing > * { grid-area: auto; }

/* --- settings ---------------------------------------------------------------------------------- */

.field { display: grid; grid-template-columns: 18ch minmax(0, 1fr); column-gap: var(--col-gap); align-items: start; padding: var(--space-sm) var(--space-xs); border-bottom: 1px solid var(--color-rule); }
.field-name { display: flex; flex-direction: column; padding-top: 4px; }
.field-name .hint { color: var(--color-ink-3); font-size: var(--text-2xs); }
.choices { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
button.choice { min-height: 32px; padding: 0 var(--space-sm); background: var(--color-paper-2); color: var(--color-ink-2); }
button.choice.on { background: oklch(76% 0.075 240 / 0.14); border-color: var(--color-accent); color: var(--color-ink); }
.switches { display: grid; grid-template-columns: repeat(auto-fill, minmax(26ch, 1fr)); gap: 0 var(--col-gap); margin: var(--space-sm) 0 0; padding: 0; list-style: none; }
button.switch {
	display: flex; flex-direction: row-reverse; justify-content: space-between; width: 100%; min-height: 40px; padding: 0 var(--space-xs);
	background: transparent; border: 0; border-bottom: 1px solid var(--color-rule); border-radius: 0; color: var(--color-ink-3);
}
button.switch.on { color: var(--color-ink); }
@media (hover: hover) { button.switch:hover:not(:disabled) { background: var(--color-paper-2); border-color: var(--color-rule); } }
button.switch:active:not(:disabled) { transform: none; }
.switch .track { position: relative; flex: none; width: 30px; height: 18px; border-radius: 999px; background: var(--color-paper-3); border: 1px solid var(--color-rule-2); transition: background-color var(--dur-short) var(--ease-out); }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-ink-3); transition: transform var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out); }
.switch.on .track { background: var(--color-accent); border-color: var(--color-accent); }
.switch.on .track::after { transform: translateX(12px); background: var(--color-accent-ink); }
.page textarea.instructions-box { margin-top: var(--space-sm); }
.instructions-box + .note-bar { margin-top: var(--space-xs); }
.devices { margin: var(--space-sm) 0 0; padding: 0; list-style: none; border-top: 1px solid var(--color-rule); }
.devices li { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs); border-bottom: 1px solid var(--color-rule); }
.devices .device { display: flex; align-items: baseline; gap: var(--space-xs); font-family: var(--font-body); }
.devices .since { margin-left: auto; color: var(--color-ink-3); font-size: var(--text-2xs); }

/* --- activity ---------------------------------------------------------------------------------- */

.stopped { display: flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-sm); padding: var(--space-sm); background: var(--color-bad-wash); border: 1px solid var(--color-bad); border-radius: var(--radius-md); }
.stopped p { flex: 1; margin: 0; color: var(--color-ink); font-family: var(--font-body); }
.meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-lg); margin-top: var(--space-sm); padding: 0 var(--space-xs); }
.meter .figures { display: flex; align-items: baseline; gap: 1ch; }
.meter .label { min-width: 10ch; color: var(--color-ink-3); font-size: var(--text-xs); }
.meter .amount { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.meter .amount.near { color: var(--color-warn); }
.meter .amount.over { color: var(--color-bad); }
.meter .limit { color: var(--color-ink-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.meter .bar { height: 6px; margin-top: var(--space-xs); overflow: hidden; background: var(--color-paper-3); border-radius: 999px; }
.meter .bar span { display: block; height: 100%; background: var(--color-accent); border-radius: inherit; }
.meter .bar.near span { background: var(--color-warn); }
.meter .bar.over span { background: var(--color-bad); }
.by-model { width: 100%; margin-top: var(--space-md); border-collapse: collapse; font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.by-model th { padding: var(--space-2xs) var(--space-xs); border-bottom: 1px solid var(--color-rule-2); color: var(--color-ink-3); font-weight: 400; text-align: left; }
.by-model td { padding: var(--space-2xs) var(--space-xs); border-bottom: 1px solid var(--color-rule); }
.by-model .num, .by-model th:not(:first-child) { text-align: right; }
.timeline-list { margin: var(--space-sm) 0 0; padding: 0; list-style: none; }
.timeline-list .day { margin-top: var(--space-md); padding: 0 var(--space-xs) var(--space-2xs); border-bottom: 1px solid var(--color-rule-2); color: var(--color-ink-2); font-family: var(--font-body); font-weight: 600; }
.timeline-list .day:first-child { margin-top: 0; }
.event { display: grid; grid-template-columns: 6ch minmax(0, 1fr) auto; column-gap: var(--col-gap); align-items: baseline; padding: var(--space-xs); border-bottom: 1px solid var(--color-rule); }
.event .time { color: var(--color-ink-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.event .what { display: flex; align-items: baseline; gap: var(--space-xs); }
.event .name { color: var(--color-accent); }
.event.is-approval .name { color: var(--color-warn); }
.event.is-job .name, .event.is-reminder .name { color: var(--color-voice); }
.event .detail { color: var(--color-ink-2); font-size: var(--text-xs); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.event .outcome { color: var(--color-ink-3); font-size: var(--text-xs); text-align: right; }
.event .outcome.good { color: var(--color-voice); }
.event .outcome.bad { color: var(--color-bad); }
.page > section > button { margin-top: var(--space-sm); }
.page button.primary { min-height: 30px; padding: 0 var(--space-md); border-radius: var(--radius-md); }

/* --- history: threads and job runs ----------------------------------------------------------- */

.convo-list { margin: var(--space-sm) 0 0; padding: 0; list-style: none; border-top: 1px solid var(--color-rule); }
.convo-row {
	display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head meta" "preview preview"; column-gap: var(--col-gap); row-gap: var(--space-2xs);
	padding: var(--space-sm) var(--space-xs); border-bottom: 1px solid var(--color-rule); color: var(--color-ink); text-decoration: none;
	transition: background-color var(--dur-short) var(--ease-out);
}
@media (hover: hover) { .convo-row:hover { background: var(--color-paper-2); } .convo-row:hover .title { text-decoration: underline; text-underline-offset: 3px; } }
.convo-row .head { grid-area: head; display: flex; align-items: baseline; gap: var(--space-xs); min-width: 0; }
.convo-row .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-body); font-size: var(--text-md); font-weight: 600; }
.convo-row .meta { grid-area: meta; display: flex; gap: 1ch; color: var(--color-ink-3); font-size: var(--text-2xs); white-space: nowrap; }
.convo-row .meta > span + span::before { content: "·"; margin-right: 1ch; }
.convo-row .preview { grid-area: preview; margin: 0; max-width: 90ch; color: var(--color-ink-2); font-family: var(--font-body); font-size: var(--text-sm); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.tag.job { color: var(--color-voice); }
.tag.thread { color: var(--color-accent); }
.convo-title { overflow-wrap: anywhere; }
.log.readonly { padding-top: var(--space-sm); border-top: 1px solid var(--color-rule); }
.log.readonly > .row.start:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.replying { margin-bottom: var(--space-md); padding: var(--space-xs) var(--space-sm); background: var(--color-paper-2); border-left: 2px solid var(--color-rule-2); border-radius: var(--radius-sm); opacity: 0.85; }
.replying .label { margin-bottom: var(--space-2xs); color: var(--color-ink-3); font-size: var(--text-2xs); }

/* --- skill editing ----------------------------------------------------------------------------- */

.skill-head .head-actions { margin-left: auto; }
.skill-form { display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-md); padding: var(--space-md); background: var(--color-paper-2); border: 1px solid var(--color-rule-2); border-radius: var(--radius-md); }
.skill-form input, .skill-form textarea { background: var(--color-paper); }
.form-field { display: flex; flex-direction: column; gap: var(--space-2xs); }
.form-label { display: flex; align-items: baseline; gap: var(--space-xs); flex-wrap: wrap; }
.form-label .hint { color: var(--color-ink-3); font-size: var(--text-2xs); }
.doc-bar { margin-bottom: var(--space-sm); padding-bottom: var(--space-xs); border-bottom: 1px solid var(--color-rule); }
.doc-bar .file { margin-right: auto; color: var(--color-ink-3); font-size: var(--text-xs); }
.file-editor { display: flex; flex-direction: column; gap: var(--space-xs); }
.file-editor .doc-bar { margin-bottom: 0; }
.skill-files .add-file { justify-content: flex-start; margin-top: var(--space-2xs); font-size: var(--text-xs); }
.skill-files .new-file input { margin-top: var(--space-2xs); padding: var(--space-2xs) var(--space-xs); font-family: var(--font-mono); font-size: var(--text-xs); }

/* --- the dock: approvals, prompt, status line ------------------------------------------------- */

#dock { position: relative; background: var(--color-paper); }
#jump { position: absolute; bottom: calc(100% + var(--space-sm)); left: 50%; transform: translateX(-50%); background: var(--color-paper-3); }
#jump[hidden] { display: none; }
#dock-inner { position: relative; max-width: var(--measure); margin: 0 auto; padding: var(--space-sm) var(--space-md) var(--space-md); }

#approvals:empty { display: none; }
#approvals { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-xs); }
.approval { padding: var(--space-xs) 0; background: var(--color-warn-wash); border: 1px solid var(--color-warn); border-radius: var(--radius-md); }
.approval .k { color: var(--color-warn); font-weight: 600; }
/* A question waits on the owner too, but asks rather than warns. */
.approval.question { background: var(--color-paper-2); border-color: var(--color-accent); }
.approval.question .k { color: var(--color-accent); }
.approval.question .ask .what { font-weight: 600; }
.approval .t { padding-left: var(--space-xs); }
.approval .ask .tool { color: var(--color-warn); }
.approval .ask .what { font-family: var(--font-body); font-size: var(--text-md); }
.approval .detail { margin-top: var(--space-2xs); }
.approval .detail summary { cursor: pointer; color: var(--color-ink-2); }
.approval .detail pre { margin-top: var(--space-2xs); padding: var(--space-xs) var(--space-sm); max-height: 50vh; overflow: auto; white-space: pre; background: var(--color-paper-2); border: 1px solid var(--color-rule); border-radius: var(--radius-sm); font-size: var(--text-xs); }
.approval .buttons { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); margin: var(--space-xs) var(--space-sm) 0 0; }
.approval .expires { color: var(--color-ink-3); font-size: var(--text-xs); margin-left: auto; }

/* The composer: a roomy text area, with the status line as its bottom bar. */
#prompt {
	display: flex; flex-direction: column; background: var(--color-paper-2); border: 1px solid var(--color-rule-2); border-radius: 10px;
	transition: border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
#prompt:focus-within { border-color: var(--color-focus-quiet); background: oklch(19.5% 0.01 250); }
#message {
	display: block; width: 100%; min-height: calc(3 * 1.55em + 2 * var(--space-md)); max-height: 45vh; margin: 0; resize: none; overflow-y: auto;
	padding: var(--space-md) var(--space-md) var(--space-xs); background: transparent; border: 0; outline: none;
	color: var(--color-ink); font-size: var(--text-md); line-height: 1.55;
}
#message:focus-visible { outline: none; }
#message::placeholder { color: var(--color-ink-3); }
#bar { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-2xs) var(--space-xs) var(--space-xs); }
#send { flex: none; min-height: 30px; padding: 0 var(--space-sm); border-radius: var(--radius-md); }
#send kbd { opacity: 0.7; }

#menu {
	position: absolute; left: var(--space-md); right: var(--space-md); bottom: calc(100% - var(--space-xs)); z-index: 3;
	max-height: 50vh; overflow-y: auto; padding: var(--space-2xs) 0; background: var(--color-paper-3); border: 1px solid var(--color-rule-2); border-radius: var(--radius-md);
}
#menu[hidden] { display: none; }
#menu .item { display: grid; grid-template-columns: minmax(10ch, auto) minmax(0, 1fr); gap: 0 2ch; padding: var(--space-2xs) var(--space-sm); cursor: pointer; }
#menu .item .v { color: var(--color-ink); white-space: nowrap; }
#menu .item .v .a { color: var(--color-ink-3); }
#menu .item .h { color: var(--color-ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menu .item.active { background: var(--color-accent); }
#menu .item.active .v, #menu .item.active .h, #menu .item.active .a { color: var(--color-accent-ink); }

#statusline {
	display: flex; flex: 1; min-width: 0; align-items: center; gap: var(--space-2xs);
	font-size: var(--text-xs); color: var(--color-ink-3); overflow-x: auto; white-space: nowrap; scrollbar-width: none;
}
#statusline .seg { min-height: 26px; padding: 0 var(--space-xs); border-radius: 999px; color: var(--color-ink-2); background: var(--color-paper-3); }
@media (hover: hover) { #statusline .seg:hover:not(:disabled) { background: var(--color-rule-2); color: var(--color-ink); } }
#statusline .seg.hint { background: transparent; color: var(--color-ink-3); }
#statusline .status { display: inline-flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-xs); }
#statusline .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--color-ink-3); }
#statusline .status.running { color: var(--color-accent); }
#statusline .status.running::before { background: var(--color-accent); animation: pulse 1.2s var(--ease-out) infinite; }
#statusline .status.page-problem { color: var(--color-warn); }
#statusline .status.problem::before { background: var(--color-warn); }
#statusline .seg.danger { color: var(--color-bad); }
#statusline .seg kbd { opacity: 0.7; }
#statusline .spend { padding: 0 var(--space-xs); font-variant-numeric: tabular-nums; }
#statusline .spend > span + span::before { content: " · "; }
#statusline .spend.near { color: var(--color-warn); }
#statusline .spend.stopped { color: var(--color-bad); }
#statusline .spacer { flex: 1; }

/* --- phones ---------------------------------------------------------------------------------- */
/* A phone gets the full width for text: no label column in the log, tabs across the header, a one-line
 * prompt with Send beside it, and the prompt only on the console. Approvals stay docked on every view. */

@media (max-width: 600px) {
	:root { --text-xs: 0.875rem; --text-2xs: 0.8125rem; }

	#horizon { height: 48px; padding: 0; gap: 0; }
	#horizon h1, #next-up { display: none; }
	/* Six views: they spread across the width when they fit, and scroll sideways when they don't. */
	#views { flex: 1; gap: 0; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
	#views::-webkit-scrollbar { display: none; }
	#views a { flex: 1 0 auto; padding: 2px var(--space-sm) 0; font-size: var(--text-md); white-space: nowrap; }
	#views.more-right { mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
	#views.more-left { mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
	#views.more-left.more-right { mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); }

	/* The log: the body takes the row, and the time sits to its right on the first row of an exchange. */
	#log { padding: var(--space-sm) var(--space-sm) var(--space-md); }
	.row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "b t"; column-gap: var(--space-sm); padding: var(--space-2xs) 0; }
	.row .k, .row .t { display: none; }
	.row .b { grid-area: b; }
	.row.start .t { display: block; grid-area: t; padding-top: 3px; }
	.row.start { margin-top: var(--space-sm); padding-top: var(--space-sm); }
	.row.you .b { padding-left: var(--space-sm); border-left: 2px solid var(--color-accent); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.45; }
	.row.cmd .b, .row.prompt .b { padding-left: var(--space-sm); border-left: 2px solid var(--color-rule-2); }
	.row.prompt .b { border-left-color: var(--color-voice); }
	.row.tool .b, .row.think .b { font-size: var(--text-xs); }
	.row.think summary::before { content: "thinking"; flex: none; color: var(--color-ink-3); font-family: var(--font-mono); }
	.row.think .args { font-size: var(--text-xs); }
	.row.remind .b::before, .row.job .b::before { margin-right: 1ch; padding: 0 var(--space-xs); border: 1px solid var(--color-warn); border-radius: 999px; color: var(--color-warn); font-size: var(--text-2xs); font-weight: 400; }
	.row.remind .b::before { content: "reminder"; }
	.row.job .b::before { content: "job"; }
	.row .snooze { display: flex; margin: var(--space-2xs) 0 0; }
	.out { grid-template-columns: auto minmax(0, 1fr) auto; }
	.out .when { grid-column: 2; }
	.help { grid-template-columns: auto minmax(0, 1fr); }
	.help .a { display: none; }

	/* The dock: approvals as cards, then the prompt as one line that grows, with Send beside it and the status below. */
	#dock-inner { padding: var(--space-xs) var(--space-sm) var(--space-sm); }
	#approvals { gap: var(--space-xs); }
	.approval { padding: var(--space-sm); }
	.approval .b { grid-column: 1 / -1; }
	.approval .buttons { margin: var(--space-sm) 0 0; }
	.approval .expires { flex-basis: 100%; margin-left: 0; }
	#prompt { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "message send" "status status"; border-radius: 14px; }
	#bar { display: contents; }
	#message { grid-area: message; align-self: center; min-height: calc(1.45em + 2 * var(--space-sm)); padding: var(--space-sm) var(--space-sm); font-family: var(--font-body); line-height: 1.45; }
	/* Only the console has the prompt to type an answer into. */
	body:not([data-view="console"]) .approval .typed { display: none; }
	#send { grid-area: send; align-self: end; margin: var(--space-xs) var(--space-xs) var(--space-xs) 0; padding: 0 var(--space-md); border-radius: 10px; }
	#statusline { grid-area: status; padding: var(--space-2xs) var(--space-xs); border-top: 1px solid var(--color-rule); }
	#statusline .seg.thinking, #statusline .seg.tools, #statusline .seg.instructions, #statusline .seg.hint, #statusline .spend .here { display: none; }
	#statusline .spend .here + span::before { content: none; }
	#message::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#menu { left: var(--space-sm); right: var(--space-sm); max-height: 45vh; }
	#menu .item { grid-template-columns: minmax(0, 1fr); padding: var(--space-xs) var(--space-sm); }
	body:not([data-view="console"]) #prompt, body:not([data-view="console"]) #menu { display: none; }
	body:not([data-view="console"]) #dock-inner { padding-top: 0; }
	body:not([data-view="console"]) #approvals:not(:empty) { margin: var(--space-xs) 0 0; }

	/* Pages. */
	.page { gap: var(--space-md); padding: var(--space-md) var(--space-sm) var(--space-lg); }
	.section-head, .page-empty, .page-note, .crumbs, .skill-head, .skill-desc { padding-left: 0; }
	.section-head h2 { font-size: 1.125rem; }
	.sched-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "due actions" "body body"; row-gap: var(--space-2xs); padding: var(--space-sm) 0; }
	.sched-row .due { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 1ch; }
	.sched-row .due span { white-space: nowrap; }
	.skill-row, .note-row, .field, .event, .devices li, .convo-row { padding-left: 0; padding-right: 0; }
	.convo-row { grid-template-areas: "head head" "meta meta" "preview preview"; }
	.note-row { grid-template-areas: "text text" "meta actions"; align-items: center; }
	.field { grid-template-columns: minmax(0, 1fr); row-gap: var(--space-xs); }
	.field-name { flex-direction: row; align-items: baseline; gap: var(--space-xs); padding-top: 0; }
	.meters { grid-template-columns: minmax(0, 1fr); gap: var(--space-md); padding: 0; }
	.event { grid-template-columns: 5ch minmax(0, 1fr); grid-template-areas: "time body" ". outcome"; row-gap: 2px; }
	.event .time { grid-area: time; }
	.event .body { grid-area: body; }
	.event .outcome { grid-area: outcome; text-align: left; }
	.timeline-list .day { padding-left: 0; }
	.stopped { flex-direction: column; align-items: stretch; }
	.skill-form { padding: var(--space-sm); }
	.page textarea.editor { font-size: var(--text-2xs); }
	.skill-body { grid-template-columns: minmax(0, 1fr); gap: var(--space-md); }
	/* The files scroll sideways; the fade says there's more. */
	.skill-files { position: static; flex-direction: row; gap: var(--space-2xs); overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
	.skill-files a { white-space: nowrap; overflow-wrap: normal; }
}
/* Touch: targets a finger can hit, and no keyboard hints. */
@media (pointer: coarse) {
	#send { min-height: 38px; }
	#send kbd, #statusline .seg kbd { display: none; }
	#statusline .seg { min-height: 32px; }
	#message { font-size: max(16px, var(--text-md)); }
	.approval .buttons button { min-height: 40px; padding: 0 var(--space-md); }
	.page button.primary { min-height: 38px; }
	.sched-row .actions button, .section-head button, .row .snooze button, .out button, .page button.plain:not(.toggle, .add-file) {
		min-height: 36px; padding: 0 var(--space-sm); background: var(--color-paper-2); border-color: var(--color-rule-2); color: var(--color-ink-2);
	}
	.sched-row .actions button.danger { color: var(--color-bad); border-color: var(--color-bad); }
}
@media (prefers-reduced-motion: reduce) {
	*, *::before { transition-duration: 0s !important; animation: none !important; }
	button:active:not(:disabled) { transform: none; }
}
</style>
</head>
<body>
<div id="app">
	<header id="horizon">
		<h1><img src="/logo.svg" alt="gaidin" width="32" height="32"></h1>
		<nav id="views" aria-label="Views">
			<a href="#/" data-view="console">console</a>
			<a href="#/history" data-view="history">history</a>
			<a href="#/schedule" data-view="schedule">schedule <span id="schedule-count" class="count"></span></a>
			<a href="#/memory" data-view="memory">memory</a>
			<a href="#/skills" data-view="skills">skills</a>
			<a href="#/activity" data-view="activity">activity</a>
			<a href="#/settings" data-view="settings">settings</a>
		</nav>
		<button id="next-up" class="plain" type="button" title="Reminders and jobs"><span>…</span></button>
	</header>
	<main id="scroll" data-view="console">
		<div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
	</main>
	<main id="history-view" data-view="history" hidden>
		<div id="history" class="page"></div>
	</main>
	<main id="schedule-view" data-view="schedule" hidden>
		<div id="schedule" class="page"></div>
	</main>
	<main id="memory-view" data-view="memory" hidden>
		<div id="memory" class="page"></div>
	</main>
	<main id="skills-view" data-view="skills" hidden>
		<div id="skills" class="page"></div>
	</main>
	<main id="activity-view" data-view="activity" hidden>
		<div id="activity" class="page"></div>
	</main>
	<main id="settings-view" data-view="settings" hidden>
		<div id="settings" class="page"></div>
	</main>
	<footer id="dock">
		<button id="jump" type="button" hidden>↓ new activity</button>
		<div id="dock-inner">
			<div id="approvals"></div>
			<div id="menu" role="listbox" aria-label="Commands" hidden></div>
			<form id="prompt">
				<textarea id="message" rows="1" placeholder="Message gaidin, or type / for commands" aria-label="Message gaidin" aria-controls="menu" autocomplete="off" spellcheck="true"></textarea>
				<div id="bar">
					<div id="statusline"></div>
					<button id="send" class="primary" type="submit">Send <kbd>↵</kbd></button>
				</div>
			</form>
		</div>
	</footer>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
